name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove server-only routes for static preview
        run: |
          mv src/app/api /tmp/runned-api
          mv src/app/auth /tmp/runned-auth
          mv src/app/sign-in /tmp/runned-sign-in
          mv src/proxy.ts /tmp/runned-proxy.ts
          trap 'mv /tmp/runned-api src/app/api; mv /tmp/runned-auth src/app/auth; mv /tmp/runned-sign-in src/app/sign-in; mv /tmp/runned-proxy.ts src/proxy.ts' EXIT
          GITHUB_PAGES=1 NEXT_PUBLIC_GITHUB_PAGES=1 GITHUB_PAGES_BASE_PATH=/Runned npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
